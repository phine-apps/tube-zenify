version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - []
    assignees:
      - []
    ignore:
      # Ignore major version updates for now (can be reviewed manually)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
