name: Bug Report
description: File a report to help us improve TubeZenify
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction Steps
      description: How do we trigger this bug?
      placeholder: |
        1. Open YouTube
        2. Click on ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension Version
      description: What version of the extension are you using?
  - type: textarea
    id: logs
    attributes:
      label: Browser Logs
      description: If applicable, add error logs from the browser console.
